version: 2
project_name: yoyopaste
builds:
  - id: yoyopasted
    main: ./cmd/yoyopasted
    binary: yoyopasted
    env: [CGO_ENABLED=0]
    goos: [darwin, windows, linux]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags: ["-s -w"]
archives:
  - builds: [yoyopasted]
    formats: [tar.gz, zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]
release:
  draft: false
